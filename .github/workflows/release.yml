name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Match tag and project versions
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run Release on a version tag, not on $GITHUB_REF_NAME"
            exit 1
          fi
          for project in Assembly-CSharp/Assembly-CSharp.Steroid.csproj AMDaemon.NET/AMDaemon.NET.Steroid.csproj; do
            version=$(grep -oP '(?<=<Version>)[^<]+' "$project")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$project::Version $version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Steroid.mm

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Assembly-CSharp.Steroid.mm.dll \
            AMDaemon.NET.Steroid.mm.dll \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
